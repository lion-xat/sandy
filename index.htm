
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ليون العراقي - رفع الصور</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 display:flex;justify-content:center;align-items:center;
 background:linear-gradient(135deg,#100b0b,#310909,#090909);
 font-family:Tahoma,Arial;color:white;padding:15px
}
.container{
 width:100%;max-width:450px;
 background:#171313;border:1px solid #8d2424;
 border-radius:20px;padding:25px;text-align:center;
 box-shadow:0 0 25px #b4000040
}
h1{color:#ff3838;text-shadow:0 0 12px red}
.upload{
 display:block;padding:30px 10px;
 border:2px dashed #d33;border-radius:15px;
 cursor:pointer;margin:20px 0;color:#ff7777
}
input[type=file]{display:none}
button{
 width:100%;padding:13px;margin-top:12px;
 border:0;border-radius:10px;background:#c71919;
 color:white;font-size:16px;cursor:pointer
}
button:hover{background:#ed2929}
img{max-width:100%;max-height:250px;
 border-radius:12px;margin-top:15px}
#result{display:none;margin-top:20px}
input[type=text]{
 width:100%;padding:12px;border-radius:8px;
 border:1px solid #a33;background:#080808;
 color:white;direction:ltr
}
#status{color:#ff7777;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h1>🦁 ليون العراقي</h1>
<p>مركز رفع الصور المباشر</p>

<label class="upload" for="photo">
 📸 اضغط هنا لاختيار صورة
 <input type="file" id="photo" accept="image/*">
</label>

<img id="preview" style="display:none">

<button onclick="uploadImage()">رفع الصورة الآن</button>

<p id="status"></p>

<div id="result">
<p>رابط الصورة المباشر:</p>
<input type="text" id="link" readonly>
<button onclick="copyLink()">نسخ الرابط</button>
</div>
</div>

<script>
let selectedFile=null;

document.getElementById("photo").onchange=function(){
 selectedFile=this.files[0];
 if(!selectedFile)return;
 let reader=new FileReader();
 reader.onload=e=>{
  let img=document.getElementById("preview");
  img.src=e.target.result;
  img.style.display="block";
 };
 reader.readAsDataURL(selectedFile);
};

async function uploadImage(){
 if(!selectedFile){
  alert("اختر صورة أولاً");
  return;
 }

 const status=document.getElementById("status");
 status.innerText="جاري رفع الصورة...";
 
 // ضع مفتاح ImgBB API الخاص بك هنا
 const API_KEY="ضع_مفتاح_API_هنا";

 let form=new FormData();
 form.append("image",selectedFile);

 try{
  const response=await fetch(
   "https://api.imgbb.com/1/upload?key="+API_KEY,
   {method:"POST",body:form}
  );

  const data=await response.json();

  if(data.success){
   document.getElementById("link").value=
    data.data.url;
   document.getElementById("result").style.display="block";
   status.innerText="تم رفع الصورة بنجاح ✅";
  }else{
   status.innerText="فشل الرفع، تحقق من مفتاح API";
  }
 }catch(e){
  status.innerText="تعذر الاتصال بخدمة رفع الصور";
 }
}

function copyLink(){
 let link=document.getElementById("link");
 link.select();
 navigator.clipboard.writeText(link.value);
 alert("تم نسخ الرابط");
}
</script>
</body>
</html>
